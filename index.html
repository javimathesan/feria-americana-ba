<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Perchas | Feria Americana</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Toastify CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <header class="header">
    <h1>Entre Perchas</h1>
    <p>Ropa de segunda mano, primera calidad</p>
    <button id="btn-ver-carrito" class="btn-carrito">
      🛒 Ver Carrito (<span id="contador-carrito">0</span>)
    </button>
  </header>

  <main>
    <section id="catalogo" class="catalogo">
      <!-- Los productos se cargan dinámicamente desde productos.json -->
    </section>

    <aside id="carrito" class="carrito oculto">
      <h2>Tu Carrito</h2>
      <div id="lista-carrito"></div>
      <hr>
      <p class="total-carrito">Total: <span id="total-carrito">$0,00</span></p>
      <button id="btn-comprar" class="btn-comprar">Realizar Compra</button>
    </aside>
  </main>

  <footer class="footer">
    <p>Entre Perchas &copy; 2026 - jmatheus</p>
  </footer>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Toastify JS -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
